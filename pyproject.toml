[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (реальные баги)
]
ignore = [
    "E501",  # длинные строки — у нас HTML, часто нужно
    "B008",  # вызов функций в default аргументах (норма для aiogram)
]